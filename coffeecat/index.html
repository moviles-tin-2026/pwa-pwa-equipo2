<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Coffee Cat - Sistema de gestión de inventario y ventas">
  <meta name="theme-color" content="#362419">
  <meta name="color-scheme" content="dark light">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Coffee Cat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Coffee Cat</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #362419;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }
    #loading-shell {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #362419;
      color: #ffffff;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    #loading-shell .brand-logo {
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      animation: pulse 2s infinite ease-in-out;
    }
    #loading-shell .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      color: #F5EBE6;
    }
    #loading-shell .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #D4A373;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-shell" aria-label="Cargando Coffee Cat">
    <img class="brand-logo" src="favicon.png" alt="Coffee Cat Logo" width="96" height="96" />
    <div class="brand-title">Coffee Cat</div>
    <div class="spinner" role="status"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    (function() {
      function removeShell() {
        var shell = document.getElementById('loading-shell');
        if (shell) {
          shell.style.opacity = '0';
          setTimeout(function() {
            if (shell && shell.parentNode) {
              shell.parentNode.removeChild(shell);
            }
          }, 400);
        }
      }

      window.addEventListener('flutter-first-frame', removeShell);
      // Fallback en caso de demora excesiva de inicialización
      setTimeout(removeShell, 10000);
    })();
  </script>
</body>
</html>
